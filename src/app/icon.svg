<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Deckwatch Kenya">
  <rect width="32" height="32" rx="7" fill="#05070a" />
  <!-- lucide ShieldAlert, the same mark the header uses. Filled rather than
       stroked: a 1.5px outline vanishes at 16px, which is where a favicon
       spends most of its life. Scaled 1.2x and re-centred so the glyph fills
       the tile instead of floating in it. -->
  <g transform="translate(1.6 1.6) scale(1.2)">
    <path
      d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
      fill="#22c55e"
    />
    <path
      d="M12 8v4"
      stroke="#05070a"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M12 16h.01"
      stroke="#05070a"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
