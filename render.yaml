# Render Blueprint for the Deckwatch API.
#
# In the Render dashboard: New -> Blueprint -> connect this repo. Render reads
# this file and creates the web service below. The database itself is NOT
# defined here — it lives in Supabase (Render's managed Postgres has no
# PostGIS). Create the Supabase project first, enable the postgis extension,
# and paste its connection string into DATABASE_URL when prompted (marked
# `sync: false` so Render asks rather than storing a value here).
#
# Scheduled ingestion runs on GitHub Actions instead of a Render Cron Job —
# Render has no free tier for Cron Jobs (it requires payment info on file
# even for the smallest plan), and Actions' free scheduled workflows cover a
# `python -m app.ingest` call every 15 minutes at no cost. See
# .github/workflows/ingest.yml.
#
# Platform UIs and the Blueprint schema change over time; if a field below is
# rejected, check Render's current render.yaml reference and adjust — the
# requirements are stable even if the exact keys aren't: build
# backend/Dockerfile, set DATABASE_URL to the Supabase connection string, and
# the API listens on $PORT (entrypoint.sh already does).

services:
  - type: web
    name: deckwatch-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Supabase connection string
      - key: SEED_ON_START
        value: "true" # keeps the map non-empty before the first ingest run
      - key: INGEST_CLASSIFIER
        value: "rule" # free, no API key; set "llm" + ANTHROPIC_API_KEY for Claude
      - key: ANTHROPIC_API_KEY
        sync: false # only needed if INGEST_CLASSIFIER=llm
